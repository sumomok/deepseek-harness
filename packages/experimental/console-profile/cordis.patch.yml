# The customer console as one bundle layer (decisions ①–⑧): the four-track
# service shell, the product console sidebar, and decision ②'s de-terminology
# layer — every shipped surface that would otherwise leak session/workspace
# vocabulary, model-internal status, or developer tooling to an end user.
#
# This is a bundle layer rather than a `--patch` overlay because the sidebar's
# menu (`workflows`, `groups`, `workbenchSessionId`) is volatile Config of the
# `server-sidebar` row, and the settings service saves it into the profile's
# own `cordis.patch.yml`. That write only succeeds when the row is inserted
# below the profile patch; a row a `--patch` overlay or the home patch inserts
# or configures outranks the saved value, and config-editor refuses the write.
# Install it with `dsh plugin --profile <name> add <this directory>` so it
# stacks after `dsh-base` and `dsh-web-app` in `dsh.profile.bundles`.
#
# The console's `permission` row is the opposite case: no caller may change it,
# so it lives in this package's `permission-lock.patch.yml`, which the
# deployment applies above the profile patch (`--patch` or the home patch).
#
# Rows that disable a shipped entry address it by id alone: a bundle's rows
# resolve through the bundle's own dependencies, and a disable row loads
# nothing.
#
# Compose the two navigation catalogs separately, in the deployment's own
# bundle layer — this file assumes neither: `dsh-experimental-content-frame`
# (with its deployment-specific `pages`/`root` config) and
# `dsh-experimental-component-surface` (with its `views`/`homeView` config).
# The sidebar's navigation group merges whichever of the two is present, and
# configuring an automatic home in both fails at load.
#
# Compose `dsh-experimental-auth-gate` separately as well: it is what the
# sidebar footer's sign-out button needs. Without that row the button still
# renders, but pressing it reports the missing login page to the console and
# goes nowhere.
#
# 'root' and 'sidebar' are each a single slot, so their shipped occupants are
# disabled outright rather than composed alongside the replacements (the same
# pattern `server-layout`'s and `server-sidebar`'s own minimal overlays use).
- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

# `@deepseek-ai/dsh-client-ui-workspace` is composed here, not disabled, even
# though `sidebar.workspaces` is dropped outright (see ServerSidebarRoot.tsx's
# module doc). `dsh-client-ui-conversation` names `uiWorkspace` in its `inject`
# list and reads the service in its `apply()`, so a disable row would leave the
# whole conversation column pending and the page would draw nothing. Its other
# registration, `conversation.hero.workspace`, therefore lands: the hero-phase
# chip carries a real Workspace title and its picker menu is live. The only
# thing keeping that vocabulary off the page is terminology-guard.ts's
# `heroWorkspaceRow` rule, which hides the row in CSS — an e2e scenario asserts
# the row is present and renders nothing, so a selector that stopped matching
# fails the gate rather than shipping the vocabulary.

# The read-only Agent-preset dropdown ("PTC 模式" and friends) has no
# customer-facing counterpart; disabling the whole package (not merely
# hiding its hero chip — see terminology-guard.ts's `heroWorkspaceRow` rule)
# also removes its session-header preset label and its Settings row.
- id: ui-agent-preset
  disabled: true

# Only relevant to an official build (`DSH_CLIENT_BUILD_PROFILE==='official'`
# gates its own apply() to a no-op otherwise): fills the sidebar brand slots
# and the conversation hero brand mark with the official DeepSeek identity,
# which this customer-form composition replaces with its own copy (see
# ServerSidebarRoot.tsx and client/index.ts's hero brand-mark takeover).
- id: ui-brand-official
  disabled: true

# ui-cordis's runtime-introspection panel has no counterpart in a customer
# deployment (there is no "the agent inspects its own plugins" story a
# customer-facing product exposes); disabling the row is the whole change —
# its own node half carries no other behavior this composition depends on.
- id: ui-cordis
  disabled: true

# Trajectory and the model selector are internal/debug surfaces with no
# customer-facing counterpart; the session-log download button names its
# subject with the banned word outright. All three are ordinary bundle rows
# with no other row depending on their presence, so disabling them is the
# whole change — see the package README's Known Limitations for the one
# caveat this carries (a customer deployment needs a working default model
# with the selector gone, since nothing here replaces its "choose a model"
# affordance).
- id: ui-trajectory
  disabled: true

- id: ui-model-selection
  disabled: true

- id: session-log-download
  disabled: true

# Settings → Plugins, both rows. `ui-settings-plugins` owns the one Plugins
# navigation entry and the section's tab chrome; the section's only tab is the
# read-only Loader inventory that `ui-settings-plugin-inventory` registers into
# `settings.plugins.tab`. Neither registers anything outside that section, so
# disabling both rows removes the section and nothing else.
#
# A console end user administers no plugins: what this deployment runs is the
# composition it was delivered with, and the inventory tab lists Cordis rows by
# package name. The sidebar Plugins page and the Host service behind both
# pages are disabled with the other Host administration rows below.
#
# With `ui-settings-plugins` gone the `settings.plugins.tab` slot is never
# declared, so the inventory row's `ctx.slots.inject('settings.plugins.tab', …)`
# would simply never fire; the row is disabled as well rather than left to wait,
# because a composition carrying a plugin whose only contribution can never
# land is a composition that misstates what it runs.
#
# `subagent-model-selection-settings` (the web bundle's host row) stays: it is
# the settings namespace the preset delegation path samples, not a page. The
# page that edits it, `ui-settings-subagent`, is disabled below.
- id: ui-settings-plugins
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

# Host administration off. Every visitor the deployment's login admits is the
# Host's one operator: `dsh-client-connection` admits each `/api` request that
# passes the Host and Origin fence and carries the browser session cookie as
# the operator Peer, with no per-method check, and the API Gateway dispatches
# every Typert Remote service on the root realm to that Peer. A Host service
# composed here is therefore a method every admitted visitor can call, whether
# or not a page offers it. The rows from here to the Schedule rows remove the
# services that administer the Host and that no console page uses; the package
# README's Known Limitations lists what stays reachable.
#
# Plugin management. The base bundle mounts `plugin-manager` whenever a profile
# is loaded. `pluginManager.installBundle` runs `pnpm add` with a caller-chosen
# package spec and reloads the profile; `setBundleEnabled` and
# `setPluginEnabled` rewrite the profile patch, which `hmr` applies without a
# restart, so one call switches on an installed bundle such as
# `@deepseek-ai/dsh-experimental-inspector-profile`, whose CDP target evaluates
# code in the Host. `plugin-inventory` answers `pluginInventory.*` with every
# Loader row, for the two Plugins pages. `ui-plugin-manager` is the sidebar
# Plugins page, which nothing here navigates to, and its refresh toast; its
# Host half answers `pluginRegistryProbe.fastest` with HTTPS requests to two
# public npm registries. The four official configuration pages,
# `ui-settings-shell`, `ui-settings-agent-loop`, `ui-settings-subagent`, and
# `ui-settings-web-search`, register only into that page's `plugins.item` slot,
# which nothing declares once `ui-plugin-manager` is gone. `hmr` stays: it has
# no Remote method, and it reloads the profile when its files change on disk.
- id: plugin-manager
  disabled: true

- id: plugin-inventory
  disabled: true

- id: ui-plugin-manager
  disabled: true

- id: ui-settings-shell
  disabled: true

- id: ui-settings-agent-loop
  disabled: true

- id: ui-settings-subagent
  disabled: true

- id: ui-settings-web-search
  disabled: true

# Dynamic Cordis packages off, both halves. `cordis-host-runner` answers
# `dynamicCordisRunner.*`: `runHostHalf` activates a caller-supplied package
# whose Host half runs in a `node:vm` realm inside the Host process, and
# `invoke` calls the handlers that half registered. No console preset mounts
# `tool-cordis` and `ui-cordis` is disabled above, so nothing here defines such
# a package. `cordis-inspect-providers` registers the Host inspect providers
# into the runner's `cordisInspect` registry and would otherwise wait for it;
# `cordis-client-runner`, the browser half, calls the runner's Remote methods
# from every page.
- id: cordis-host-runner
  disabled: true

- id: cordis-inspect-providers
  disabled: true

- id: cordis-client-runner
  disabled: true

# Interactive terminals off, both halves. `terminal-controller` answers
# `terminal.create`, which spawns a shell in the session's directory with the
# Host user's permissions, outside the Agent sandbox and with no approval step,
# and `terminal.write`, which types into it. `ui-sidebar-terminal` is the right
# sidebar's Terminal tab over the controller's browser half.
- id: terminal-controller
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

# Provider discovery off. `llm-pi-ai` registers the only model discovery
# `llm.discoverModels` runs, which fetches a caller-supplied base URL from the
# Host. Its `providers` field is volatile Config a settings write reaches, and a
# provider written there names its own endpoint and credential reference, so a
# prompt on that route would send the named stored credential to the writer's
# endpoint. The row is mounted with no provider, the console's model runs on
# `llm-deepseek`, and the Models page that fills the row, `ui-settings-models`,
# is disabled above; with the row gone, `llm.discoverModels` answers that no
# discovery is registered.
- id: llm-pi-ai
  disabled: true

# Web search and fetch off, all three Host rows. The Web bundle disables
# `tool-web`, and neither console preset mounts `web_search` or `web_fetch`, so
# `web`, `web-search-deepseek`, and `web-fetch-http` serve no caller here. The
# search row's `apiKey`, `apiKeyEnv`, and `baseURL` are still volatile Config a
# settings write reaches: a credential reference and an endpoint no console
# feature reads, which a later caller of the service would use.
- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  disabled: true

# Directory browsing off. Off a loopback bind, under SSH, or on a Linux Host
# without a display and a chooser program, `directory-picker` mounts the browse
# backend: `directoryPicker.list` lists any directory from the filesystem root,
# and `directoryPicker.createDirectory` creates one, as the Host user. It
# serves `ui-workspace`'s add-workspace flow, which the console sidebar does not
# offer. With no backend composed, `workspace-controller`'s picker child waits
# and `directoryPicker.*` is not served, while the rest of that controller
# runs.
- id: directory-picker
  disabled: true

# Open In off, both halves. `open-in-app` serves the routes that list the Host's
# applications and launch one on an absolute path, and `ui-open-in-app` is the
# session header's "Open In…" button over them. A Host with no display lists no
# application, and the console has no use for opening a path on the Host's
# desktop either way.
- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

# Office rendering off. `office-to-pdf` answers `officeToPdf.render`, which
# converts the Office file at a caller-named path with the bundled LibreOffice
# kit inside the Host. Office previews are not a console feature; the right
# sidebar's document tab reports an Office file it cannot render.
- id: office-to-pdf
  disabled: true

# Schedule off, both halves. `dsh-web-app` composes `schedule`, the Host task
# store that delivers each due reminder as a follow-up in the session that
# created it and answers the `schedule.*` Remote methods, and `ui-schedule`,
# the browser half: the Automation tasks page and the card a created reminder
# draws. A console is one Host every signed-in visitor shares:
# `schedule.catalog` returns every session's tasks, and the four `schedule_*`
# tools create, change, and delete tasks with no approval step.
#
# The four tools and the `time-context` clock row belong to the presets that
# declare them — the shipped rows `preset-standard`, `preset-ptc`, and
# `preset-cordis`, all disabled below — and neither console preset declares
# either. A preset that mounted `tool-schedule` without the `schedule` service
# would load it and register none of the four tools: it registers them only
# once that service resolves.
- id: schedule
  disabled: true

- id: ui-schedule
  disabled: true

# Live client plugin replacement off. `dsh-web-app` composes `client-hmr`,
# which swaps new plugin bundles into an open page that keeps running its
# loaded shell; after an upgrade that page fails to draw, and a page still
# running the previous client does not work against the new server either. The
# `page-refresh` row below reloads such a page instead. With this row, a plugin
# bundle rebuilt by `pnpm run dev:web` reaches no console page, open or newly
# loaded, until the host restarts: `client-hmr` is what reports a rebuilt bundle
# to the host. A rebuilt shell is served on the next load, and an open page's
# next build check reloads it onto that shell with the old plugin bundles.
- id: client-hmr
  disabled: true

# No model request carries the Web bundle's developer orientation. With
# `surfaceContext: false` the `web-runtime` row registers neither the
# `harness:source` prompt section (the path of the DeepSeek Harness checkout,
# for inspecting or extending DSH) nor `app:web-surface` (the page's local URL,
# `pnpm run dev:web`, and rebuilding the Web artifacts), nor the `DSH_WEB_URL`
# variable it adds to a shell command's environment. The flag gates those three
# registrations and nothing else, and only the `bash` and `pwsh` tools read the
# variable; neither console preset offers them. A patch replaces a row's whole
# config, so the other four fields restate the Web bundle's own values
# (`tests/profile.spec.ts` checks that the two rows name the same fields).
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# `ui-deliverables` registers its `ui:deliverable-file-references` prompt
# section unconditionally: how to show results inline, when to call `present`,
# and how to link file paths. Neither console preset offers `present`, and the
# package has no Config, so the row goes; its README names removing the row as
# the way to turn the surface off. With it go the changed-files card (drawn only
# with Coding Tools on), the delivery cards `present` produces, clickable file
# paths in a closing answer, and the review tab those open.
- id: ui-deliverables
  disabled: true

# No model request opens with `You are an AI agent powered by DeepSeek
# Harness.`: asked what runs it, a console assistant given that sentence names
# DeepSeek Harness to the customer. `includeHarnessIdentity: false` omits that
# fixed sentence and nothing else, so each console preset's persona prefix
# opens the prompt. A patch replaces a row's whole config, so the other two
# fields restate the Web bundle's values (`tests/profile.spec.ts` checks that
# the two rows name the same fields).
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# The internal-testing notice ("内测声明") is `ui-settings-models`'s own
# `settings.onboarding` step, shown once per acknowledgement version; the same
# package registers the Models settings section and the DeepSeek credential
# onboarding step. A customer deployment fixes its model and credential at the
# deployment layer and must never show a DeepSeek-internal notice, so the whole
# row goes; with no step registered, `settings.onboarding` renders nothing.
- id: ui-settings-models
  disabled: true

# The Settings → General "Permission" row: the default preset for new sessions,
# and the last user-facing permission control once the composer chip is hidden
# (`terminology-guard.ts`) and `/permission` is isolated on the `permission` row
# in `permission-lock.patch.yml`. The same package's only other registration is
# the `/permission` popup decoration, which has no host command left to
# decorate.
#
# Disabling this row removes the page's control for `permission.defaultPreset`;
# the `remote.settings` method still accepts a write, which is why the
# `permission` row itself is composed above the profile patch by
# `permission-lock.patch.yml` rather than in this layer.
- id: ui-permission
  disabled: true

# The Settings → General switch "Upload Session Log when using the official model
# API / Help improve DeepSeek models and products" names the official vendor and
# the banned word, and a save from it lands in the deployment's shared profile
# patch, so one visitor's choice would apply to every session the host serves.
# The package's only other registration is the toast that reports such a save.
# The host row the switch edits, `session-log-deepseek`, stays mounted at the
# base bundle's `enabled: false`.
- id: ui-settings-session-log
  disabled: true

# Settings → General → Performance & usage starts at compact for a console user:
# no per-Turn token usage under a completed answer. The composer statistics row
# is hidden in either mode by `terminology-guard.ts`. `performanceUsage` is
# volatile Config, and this row sits below the profile patch, so it is the
# inherited value: a user's choice in Settings is saved into the profile patch
# and outranks it, and resetting the choice returns to compact. The same row in
# `permission-lock.patch.yml` would make config-editor refuse that write.
#
# The same package's "Compaction while busy" row, which picks when a `/compact`
# typed during a running turn runs, a command the console's presets do not
# compose, is withheld by `server-sidebar`
# (`settings-entries.ts`); `busyCompaction` keeps its default, `turn-end`, and is
# not restated here.
- id: ui-chat
  config:
    performanceUsage: compact

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: server-sidebar
      name: '@deepseek-ai/dsh-experimental-server-sidebar'
      config:
        # Claim of this deployment's access token that carries the signed-in
        # person's display name, shown in the sidebar's footer; toy-core's
        # sign-on writes it as `login_uname`.
        displayNameClaim: login_uname

# The page's build check and connection banner. Each time an open page
# reconnects or, while connected, returns to the foreground it compares the
# build it booted with against the build the server now serves, and reloads
# once when they differ; the banner reports a lost connection and offers a
# reload when it lasts. The config states the plugin's own defaults. None of
# its fields is volatile, so the settings service offers no form for them and
# refuses a write to them, and a deployment changes them in its own layer. A
# value out of range there leaves the host running with a startup warning and
# fails the boot of every page it serves.
- insert:
    - id: page-refresh
      name: '@deepseek-ai/dsh-experimental-page-refresh'
      config:
        checkOnVisible: true
        reloadDelayMs: 0
        disconnectNotice: true
        stuckAfterSeconds: 60

# The MCP capability, mounted with no server. This row is what makes reaching
# an external MCP server a deployment's decision rather than a build's: the
# console always carries the capability, and a deployment adds servers by
# writing them into this row's `servers` list — an endpoint and the NAME of a
# credential, never a value, never a package.
#
# An empty list is the ordinary state, and it is not idle-by-accident: the row
# loads, opens no connection, registers no tool, and adds nothing to any model
# request. A deployment that reaches one server patches this row's `config` in
# its own layer — the deployment bundle or a `--patch` overlay:
#
#     config:
#       servers:
#         - id: iot
#           url: https://mcp.example.internal/mcp
#           auth:
#             header: Authorization
#             credential: IOT_MCP_TOKEN
#             scheme: 'Bearer '
#
# `servers` is ordinary Config, not a `.volatile()` field, so the settings
# service offers no form for it and refuses a `remote.settings` write to it: no
# browser the deployment admits can add a server.
#
# `credential` is a reference the credentials seam resolves — an
# environment-variable name, resolved from `$DSH_HOME/.credentials.yaml`, the
# process environment, or a `.env` file, whichever the composed provider reads.
# The value never appears in this file, and a reference nothing has stored a
# value for fails this row at load naming the reference, rather than producing
# a server whose every tool call is refused.
#
# `id` is the tool namespace: that server's tools reach the model as
# `mcp__iot__<tool name>`. Two rows claiming one id fail at load.
#
# Only Streamable HTTP endpoints are offered here. A stdio server is a local
# program the host would start outside every sandbox this product applies, and
# a console deployment does not make that decision through this row.
#
# A server reached under THIS deployment's signed-in visitor rather than under a
# service credential points its `url` at the auth-gate forward instead
# (`mcpUpstreams` on the `auth-gate` row, and no `auth` here) — see that
# package's README. The two differ in whose identity the write lands under, so
# the choice belongs to whoever composes the deployment.
- insert:
    - id: console-mcp
      name: '@deepseek-ai/dsh-experimental-console-mcp'
      config:
        servers: []

# The bundled library-knowledge layer: one isolated `skill-filesystem` provider
# over `@deepseek-ai/dsh-experimental-library-skills`'s own `skills/` directory.
#
# `providerName` must differ from every other provider in the layer — a repeated
# name throws at insert. `includeDefaultRoots: false` keeps the row off the
# project, user, and environment roots, so it contributes this one directory and
# nothing else. `bundledSkillDir` mounts it at `BUNDLED_SKILL_RANK` (600), below
# every user-writable root, which is what lets a user's same-named skill replace
# a shipped one.
#
# The path resolves the package by name from the profile this layer is installed
# into, so the skills travel with the package version rather than with a
# deployment path. This row therefore makes that package a deployment dependency
# of every composition carrying it: a profile that cannot resolve it throws
# MODULE_NOT_FOUND while the row loads, and the boot fails. The quiet failure is
# the other one — a resolvable package whose `skills/` is missing or empty mounts
# a root that lists nothing.
- insert:
    - id: library-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: library-skills
        includeDefaultRoots: false
        bundledSkillDir: !!js "process.getBuiltinModule('node:path').resolve(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-library-skills/package.json'), '../skills')"

# Automatic compaction at 60% of the context window. Before each model request
# of a turn, the first included, the conversation is condensed when the history
# already recorded takes more than 60% of the window (or the window minus the
# reserved output and the compaction backend's headroom, whichever is less), and
# the turn carries on. Before a turn's first request that history ends before
# the message just sent, which the check does not count.
# `@haoran/dsh-auto-compact` is an out-of-repo plugin, vendored
# as `vendor/haoran-dsh-auto-compact-0.5.1.tgz` and declared under
# `dependencies` as a `file:` tarball.
#
# This is a host-plane row; the engine it calls is `compaction-basic`, which
# lives inside each Agent preset's `compaction` group below (`isolate:
# compaction`), where no host-plane injection can see it. The plugin resolves
# it for each agent through `ctx.agentPresets.serviceFor(agent, 'compaction')`,
# so `console` and its `standard` twin are both covered. Once it reaches an
# engine, its `compactionPolicy` service turns off `compaction-basic`'s own
# between-steps pressure check, which this row's check before each request
# replaces; the backend's overflow recovery is unaffected.
#
# Both fields are volatile, so these are the inherited values: a settings write
# saves a different value into the profile patch, which outranks this layer.
# The page offers no control for either: `server-sidebar` withholds the plugin's
# Settings → General row. The rows a compaction draws in the conversation are
# not this plugin's: the running row is `ui-chat`'s, and `server-sidebar`
# replaces the landed and failed ones with one fixed sentence each; the package
# README's Known Limitations states what they show.
- insert:
    - id: auto-compact
      name: '@haoran/dsh-auto-compact'
      config:
        enabled: true
        thresholdPercent: 60

# The `console` Agent preset: the customer assistant's own tool set. It keeps
# the shipped `standard` preset's realm rules and drops every developer row —
# shell, file search, background jobs, goals, plan mode, delegation, the web
# tool, `present`, and the checkout's agent instructions — so a data question is
# answered through the content column, whose tools (`content_show`,
# `show_component`, and the reads the `content-frame` row registers) live on the
# host plane and reach every preset. `tool-fs` stays so the agent can write the
# skills it distils into `<workspace>/.dsh/skills`. The compaction group carries
# the engine and the tool-result pruner but not `command-compact`: the card a
# typed `/compact` draws shows item and token counts and opens the English
# summary, and the console compacts on its own at 60% (the `auto-compact` row
# above), so the slash menu offers no 压缩. The persona carries no
# working-directory suffix, unlike the shipped presets'. Its last sentence asks
# for Chinese in everything a user sees, the reasoning included: the
# conversation's process rows show the model's reasoning text.
#
# The registry's default is set by the lock (`permission-lock.patch.yml`), not
# here: the default's volatile `selectedDefault` field is writable through
# `remote.settings`, and with this preset and its `standard` twin below the only
# ones declared, any other value would make every new session fail.
- insert:
    - id: preset-console
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: console
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是工作台小助手。用户问到的数据，一律通过组件展示给用户看；不要描述你的工作目录、工具或内部实现。向用户提到表、字段、图层、条目和分类时，一律用它们的中文显示名称，不要说出表名、条目 id、编码、枚举值这类内部标识；没有中文名称的，用平实的话描述。凡是用户能看到的文字一律用中文，包括开场的第一句话；你的思考过程也会显示给用户，同样用中文写。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

# A session records the id of the preset it was created under and resumes under
# that id. Sessions a console deployment created before `console` existed carry
# `standard`, and with no `standard` declared they could not resume: no message,
# no navigation. This row declares `standard` with exactly `console`'s plugins
# (`tests/profile.spec.ts` asserts the two lists are equal), so those sessions
# resume with the customer tool set and a caller naming `standard` over RPC gets
# nothing `console` does not already offer.
- insert:
    - id: preset-standard-as-console
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是工作台小助手。用户问到的数据，一律通过组件展示给用户看；不要描述你的工作目录、工具或内部实现。向用户提到表、字段、图层、条目和分类时，一律用它们的中文显示名称，不要说出表名、条目 id、编码、枚举值这类内部标识；没有中文名称的，用平实的话描述。凡是用户能看到的文字一律用中文，包括开场的第一句话；你的思考过程也会显示给用户，同样用中文写。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

# The console offers no preset picker (`ui-agent-preset` is disabled above), but
# `session.create` accepts an `agentPreset` over RPC, so every shipped preset is
# disabled rather than merely unreachable from the page: `standard`, `ptc`, and
# `minimal` carry the shell and the other developer rows `console` leaves out,
# and the cordis preset also mounts `tool-cordis` and the skill catalog whose
# `cordis-composition-reference` skill lists every workspace package. The
# shipped `standard` row is replaced by the one above, not merely disabled.
- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true
