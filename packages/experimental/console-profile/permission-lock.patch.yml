# The console's lock: the rows a deployment applies above the profile patch,
# with `dsh --profile <name> --patch <this file>` (or as the home patch,
# `$DSH_HOME/cordis.patch.yml`). They are not part of this package's bundle
# layer on purpose. Every row here has volatile Config fields, so the settings
# service writes them into the profile patch on request, and the
# `remote.settings` method answers any browser the deployment admits; on a
# console every such write lands in the one profile patch every visitor shares,
# the browser-side preferences included (`dsh-experimental-server-base`'s
# `ownsHost` makes the Settings page persist to the Host). Composed in a layer
# above the profile patch, these rows outrank any such write: config-editor
# refuses it whenever the row carries a `config` key, and a value an earlier
# release or an earlier visitor stored, in the profile patch or in
# `settings.yaml`, no longer takes effect. The bundle layer below carries the
# rows the settings service must be able to save; this file carries the rows no
# caller may change.
#
# A row here replaces the row's whole `config`, so each one restates every
# field the layers below set. Each row also names its package: a `name` that
# no longer matches the composed row makes the loader skip the row with a
# warning and leaves the field writable, which `tests/profile.spec.ts` checks
# by composing this file with no warning.
#
# Decision ②: the shipped preset table names its rows in vendor vocabulary —
# "workspace-write" renders as "Workspace Write" on the composer's access chip
# (`dsh-client-ui-conversation`'s `PermissionSelect`). That is not CSS chrome
# this package could rename, and it is not reachable from a dictionary: the
# label belongs to `dsh-client-ui-conversation`'s own locale namespace, which
# no other plugin may register into.
#
# The preset table itself is the seam. The chip resolves its label from the
# host-supplied `name`: one that still matches the built-in default renders the
# vendor's product label, anything else passes through verbatim
# (`PermissionSelect.tsx`'s `permissionLabel`). Renaming the rows here
# therefore replaces the vocabulary with no patch to an upstream package.
#
# All three shipped presets are restated, knob values (`sandbox`, `approval`)
# unchanged: this row replaces the whole table, so omitting one drops that
# preset rather than inheriting it. The access chip is `ui-permission`'s
# registration, and the console bundle disables that row, so no page renders these names
# today; they are what any surface that names the pinned preset would show.
# `tests/profile.spec.ts` asserts the table.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  # No permission switch reaches an end user (product decision, 2026-09-07).
  # `commands` resolves inside this entry to a realm nothing implements, so the
  # row's `ctx.inject(['commands'], …)` child never activates: `/permission` is
  # never registered, `commands.list` never names it, and the slash menu has no
  # row to filter. Isolation is per entry, so the registry the base bundle
  # composes is untouched — the switcher strip's tab and close buttons, the
  # sidebar's navigation rows, `show_component`'s press return path, and
  # `SessionFace.command()` all keep the `commands` they inject.
  isolate:
    commands: true
  config:
    # The preset a new session is pinned to: what this table derives today
    # from the composed sandbox and approval defaults (workspace-write + ask,
    # `packages/bundle/base/cordis.patch.yml`). Composed above the profile
    # patch, it outranks a stored `permission.defaultPreset` (see the header).
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: 只读
        description: 只查看和分析文件，不做任何改动。
        glyph: read-only
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 可修改文件
        description: 可以在当前项目目录里新建和修改文件；超出范围的操作会先征求同意。
        glyph: workspace-write
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全放开
        description: 可以修改任何文件，且不再逐次征求同意。
        glyph: danger-full-access

# Every new session runs the bundle layer's `console` Agent preset. Restating
# the whole config leaves `selectedDefault` unset, and config-editor refuses a
# write to it: the one preset the console declares would otherwise be one
# settings write away from a default no declaration answers, which fails every
# new session with `agent-preset/not-found`.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: console

# Session-log upload to the official model API stays off for every session. The
# switch that writes `enabled` is disabled in the bundle layer
# (`ui-settings-session-log`), but `enabled` is volatile Config and the
# `remote.settings` method still accepts a write from any browser the deployment
# admits; below the lock, that one write would set the upload for every session
# the host serves. This row replaces the base bundle's `config` wholesale, so
# `maxBytes` falls to the plugin default, as it does there.
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false

# The model route is the deployment's. Every field of the `llm-deepseek` row is
# volatile Config, `baseURL` and the `apiKeyEnv` credential reference included:
# below the lock, one settings write could point every session's model requests
# at the writer's endpoint and send it whichever stored credential the reference
# names. The base bundle composes the row with no config, and this row restates
# exactly that: every field takes its schema default (`baseURL` falls back to
# `$DEEPSEEK_BASE_URL` from a trusted environment layer, then the public API;
# `apiKeyEnv` to `DEEPSEEK_API_KEY`), and config-editor refuses a write to any
# of them. A deployment that configures this row in its own layer moves that
# config into this row, since this row replaces the row's whole config.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config: {}

# The account model route shares the protocol Config, so its `baseURL` and model
# catalog are volatile the same way `llm-deepseek`'s are: below the lock, one
# settings write could repoint a session that `session.selectModel` switches to
# the account provider. The base bundle composes this row with no config, and
# this row restates that `{}`, so config-editor refuses a write to any field.
# Signing the Host in or out of a DeepSeek account over `account.*` is a
# separate Remote surface this row does not touch (see the package README's
# Known Limitations).
- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  config: {}

# The default model of every new session. `provider`, `model`, and
# `reasoningEffort` are volatile Config, and `session.selectModel` saves each
# per-session choice into them, so below the lock one visitor's choice, or a
# settings write naming no available model, would become every later session's
# default. This row restates the base bundle's values; with it composed,
# `session.selectModel` still switches the one session and logs that the
# default was not saved. A deployment that runs another default model states it
# here.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-flash

# The shell Executor's limits. `cwd`, `timeoutMs`, `maxTimeoutMs`,
# `maxOutputBytes`, `maxSpillBytes`, and `graceMs` are volatile
# (`packages/shell/bash-local/src/index.ts`, whose Config `bash-sandbox`
# inherits). Neither console preset offers a shell tool, so no console session
# runs a command through it today; below the lock, a settings write would still
# change the limits for any later caller. This row restates the base bundle's
# `timeoutMs` (`packages/bundle/base/cordis.patch.yml`); every other field keeps
# its schema default, and `cwd` stays unset. The row's `disabled` expression,
# which mounts it on every platform but Windows, is the base bundle's and is
# not restated.
- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

# How many tool calls of one step run at once, for every session.
# `maxParallelToolCalls` is volatile; `agents` is the base bundle's empty list
# (`packages/bundle/base/cordis.patch.yml`), restated because this row replaces
# the whole config. 10 is the schema default
# (`DEFAULT_MAX_PARALLEL_TOOL_CALLS`, `packages/core/agent-loop/src/constants.ts`),
# and the console bundle disables the page that edits it
# (`ui-settings-agent-loop`).
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
    maxParallelToolCalls: 10

# Delegation depth and the number of live subagents. Both fields are volatile
# and no shipped layer configures the row, so these are the schema defaults
# (`packages/subagent/subagent/src/index.ts`). Neither console preset delegates.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  config:
    maxDepth: 1
    maxActiveSubagents: 8

# Whether a delegation may pick its own model, and from which routes. Both
# fields are volatile and no shipped layer configures the row, so these are the
# schema defaults (`packages/subagent/tool-subagent/src/model-selection-settings.ts`);
# the console bundle disables the page that edits them (`ui-settings-subagent`).
- id: subagent-model-selection-settings
  name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
  config:
    enabled: false
    allowedModels: []

# Automatic compaction at 60% of the context window, for every session. The
# console bundle inserts the row without a config; both fields are volatile, so
# below the lock a settings write would move the share for every session. The
# page offers no control for them: `server-sidebar` withholds the plugin's
# Settings → General row.
- id: auto-compact
  name: '@haoran/dsh-auto-compact'
  config:
    enabled: true
    thresholdPercent: 60

# The page's language. `preference` is volatile; restating the Web bundle's
# empty config leaves it unset, so each browser shows its own language rather
# than the last language any visitor picked. `server-sidebar` withholds the
# Language row.
- id: locale
  name: '@deepseek-ai/dsh-client-locale'
  config: {}

# Appearance and font size. Both are volatile; these are the schema defaults
# (`DEFAULT_PREFERENCE` and `DEFAULT_FONT_SIZE`,
# `packages/client/ui-theme/src/theme-settings.ts`), and with `system` each
# browser follows its own system's light or dark mode. `server-sidebar`
# withholds the Appearance and Font size rows.
- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: system
    fontSize: 14

# The Chat column's preferences. `performanceUsage: compact` is the console's
# own choice (no per-Turn token usage under a completed answer; the schema
# default is `detailed`); `linkOpening: sidebar` and `busyCompaction: turn-end`
# are the schema defaults (`packages/client/ui-chat/src/chat-settings.ts`).
# `transcriptView` is not stated: the browser then uses its own default,
# `detailed`, and a write to it is refused with the rest of the row.
# `server-sidebar` withholds the Performance & usage, Open chat links in, Work
# details, and Compaction while busy rows.
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  config:
    performanceUsage: compact
    linkOpening: sidebar
    busyCompaction: turn-end

# What Enter does while a turn runs. `busyEnter` is volatile; `queue` is the
# schema default (`DEFAULT_BUSY_ENTER_BEHAVIOR`,
# `packages/client/ui-conversation/src/submission-settings.ts`).
# `server-sidebar` withholds the row.
- id: ui-conversation
  name: '@deepseek-ai/dsh-client-ui-conversation'
  config:
    busyEnter: queue

# The developer-tools preference (Settings → General "Show coding view"). The
# schema default is on (`packages/client/ui-settings/src/developer-tools-settings.ts`);
# the console holds it off. Of what it gates, the console composes only the
# right sidebar's HTML preview, which with it off draws a sanitized static copy
# of the page: no script runs and no related file is read. `server-sidebar`
# withholds the switch.
- id: ui-settings
  name: '@deepseek-ai/dsh-client-ui-settings'
  config:
    enabled: false
