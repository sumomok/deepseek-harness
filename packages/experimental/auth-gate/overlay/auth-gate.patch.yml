# The deployment's own single sign-on, in front of a dsh Web surface. One row:
# the node half claims the settings, token, and forwarding routes, and the
# browser half runs the gate on every page load.
#
# `loginUrl` is the deployment's login page as the browser addresses it. It is a
# hash-routed page, so the `?redirect=<return address>` the browser half appends
# lands inside the fragment, which is where that router reads it.
#
# `mcpUpstreams` is empty here because which MCP servers a deployment forwards
# to is deployment-specific. Adding one — `crm: https://mcp.internal/crm` —
# claims `/auth-gate/mcp/crm`, and the matching `dsh-mcp-client` row then points
# its `url` at that path instead of at the server, which is how it gets a
# per-visitor token it could not otherwise obtain.
#
# `bizUpstream` is absent for the same reason, and its absence means this
# deployment offers no data backend: nothing registers `bizBackend`, and a row
# that consumes it stays pending with the missing service named. A deployment
# that does offer one writes its base here, ending in `/` and carrying the API
# prefix its frontend was built with — `bizUpstream: https://<host>/ini-server/`
# for a standard install, and the origin root for an install built without a
# prefix.
#
# `renewalPath` and `renewalIntervalSeconds` are absent for the same reason, and
# their absence means the expiry margin sends the visitor back through the login
# page. A deployment whose sign-on renews writes both — `renewalPath:
# /toy-proxy/ini-server/nrms-auth/api/renewal` and `renewalIntervalSeconds:
# 1800` for a standard install — and the browser half then replaces the token in
# place, without a navigation. The path is a browser-side address on this
# deployment's own origin, carrying whatever prefix the reverse proxy serves it
# under, and one field without the other fails the row.
- insert:
    - id: auth-gate
      name: '@deepseek-ai/dsh-experimental-auth-gate'
      config:
        loginUrl: /toy-proxy/toy-login/#/
        cookieName: accessToken
        refreshMarginSeconds: 300
        mcpUpstreams: {}
