# The full customer/service-line composition (decisions ①–⑧): the
# four-track service shell, this product console sidebar, and decision ②'s
# de-terminology layer — every shipped surface that would otherwise leak
# session/workspace vocabulary or model-internal status to an end user.
#
# Compose `dsh-experimental-content-frame` (with its deployment-specific
# `pages`/`root` config) separately, the same way `overlay/sidebar-menu.patch.yml`
# already documents — this file does not assume any one page catalog.
#
# 'root' and 'sidebar' are each a single slot, so their shipped occupants are
# disabled outright rather than composed alongside the replacements (the same
# pattern `server-layout`'s and this package's own minimal overlay use).
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

# The read-only Agent-preset dropdown ("PTC 模式" and friends) has no
# customer-facing counterpart; disabling the whole package (not merely
# hiding its hero chip — see terminology-guard.ts's `heroWorkspaceRow` rule)
# also removes its session-header preset label and its Settings row.
- id: ui-agent-preset
  name: '@deepseek-ai/dsh-client-ui-agent-preset'
  disabled: true

# Only relevant to an official build (`DSH_CLIENT_BUILD_PROFILE==='official'`
# gates its own apply() to a no-op otherwise): fills the sidebar brand slots
# and the conversation hero brand mark with the official DeepSeek identity,
# which this customer-form composition replaces with its own copy (see
# ServerSidebarRoot.tsx and client/index.ts's hero brand-mark takeover).
- id: ui-brand-official
  name: '@deepseek-ai/dsh-client-ui-brand-official'
  disabled: true

# ui-cordis's runtime-introspection panel has no counterpart in a customer
# deployment (there is no "the agent inspects its own plugins" story a
# customer-facing product exposes); disabling the row is the whole change —
# its own node half carries no other behavior this composition depends on.
- id: ui-cordis
  name: '@deepseek-ai/dsh-client-ui-cordis'
  disabled: true

# Trajectory and the model selector are internal/debug surfaces with no
# customer-facing counterpart; the session-log download button names its
# subject with the banned word outright. All three are ordinary bundle rows
# with no other row depending on their presence, so disabling them is the
# whole change — see the package README's Known Limitations for the one
# caveat this carries (a customer deployment needs a working default model
# with the selector gone, since nothing here replaces its "choose a model"
# affordance).
- id: ui-trajectory
  name: '@deepseek-ai/dsh-client-ui-trajectory'
  disabled: true

- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true

- id: session-log-download
  name: '@deepseek-ai/dsh-session-log-export'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: server-sidebar
      name: '@deepseek-ai/dsh-experimental-server-sidebar'

# Decision ②: the shipped preset table names its rows in vendor vocabulary —
# "workspace-write" renders as "Workspace Write" on the composer's access chip
# (`dsh-client-ui-conversation`'s `PermissionSelect`), in the `/permission`
# popup, and in the Settings default row. None of that is CSS chrome this
# package could hide, and none of it is reachable from a dictionary: those
# labels belong to `dsh-client-ui-conversation`'s own locale namespace, which
# no other plugin may register into.
#
# The preset table itself is the seam. Both client surfaces resolve a label
# the same way — a host-supplied `name` that still matches the built-in
# default renders the vendor's product label, anything else passes through
# verbatim (`PermissionSelect.tsx`'s `permissionLabel`,
# `presentation.ts`'s `displayPermissionPreset`). Renaming the rows here
# therefore replaces the vocabulary on every surface at once, with no patch to
# an upstream package.
#
# The knob values (`sandbox`, `approval`) are restated unchanged from the
# shipped defaults: this row replaces the whole table, so omitting one would
# drop that preset rather than inherit it.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 可修改文件
        description: 可以在当前项目目录里新建和修改文件；超出范围的操作会先征求同意。
        glyph: workspace-write
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全放开
        description: 可以修改任何文件，且不再逐次征求同意。
        glyph: danger-full-access
