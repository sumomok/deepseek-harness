# One view of this pack: the deployment's own layer table, drawn by the
# `toy.crud` part the manifest requires. `spec` is the structure the component
# catalog judges — the same structure a `show_component` call writes — and
# `params` are the values this pack fills its `{"$param": …}` references with
# when the view is loaded. The pack root's provider carries both through
# without reading either.
id: space-layer
title: 图层数据
spec:
  nodes:
    - id: layer-table
      component: toy.crud
      props:
        relatedMeta: { $param: table }
        metaLabel: { $param: label }
        isInitQuery: true
params:
  table: sys_layer
  label: 图层
