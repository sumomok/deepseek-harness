# Reverse-proxy half of a `/console/` deployment: nginx strips the prefix, the
# dsh process keeps serving its root-absolute routes, and the browser puts the
# prefix back on every URL from the `<base>` element and `__DSH_BASE__` global
# this package injects. Pair it with `overlay/base-path.patch.yml`.
#
# Module constraint: the nginx this is written for is built WITHOUT
# ngx_http_rewrite_module, so `rewrite`, `return`, `if`, and `set` are all
# unavailable. Prefix stripping therefore comes from proxy_pass's own URI
# rewriting — a `location` with a trailing slash proxying to an upstream URI
# with a trailing slash replaces the matched prefix with `/` — and only the
# slash-terminated form of the prefix is published. `map` and `error_page` are
# used instead, from ngx_http_map_module and the core module. The site gate
# below additionally needs ngx_http_auth_request_module compiled in
# (`--with-http_auth_request_module`; `nginx -V` lists it), and map values
# carrying a variable need nginx 1.11.0 or newer.
#
# The dsh half of the same deployment: the process has to be told which public
# authority it is reached by. `proxy_set_header Host $host` below forwards
# `console.example.com` unchanged, and the /api browser-trust fence
# (packages/client/connection/src/api-request-trust.ts) refuses every request
# whose Host is neither a loopback authority nor a declared `trustedHosts`
# entry. Without that entry the PROCESS answers 403 to every /api request while
# the page itself loads, and nginx has played no part in the refusal. Declare
# the authority in the same overlay layer that carries `basePath`:
#
#     - id: connection
#       config:
#         trustedHosts:
#           - console.example.com
#
# A patch replaces the targeted row's whole `config`, so a deployment whose
# process also binds all interfaces keeps the runtime-derived LAN literals by
# writing `trustedHosts: !!js "['console.example.com', ...ctx.webRuntime.trustedHosts]"`
# instead. That fence is a DNS-rebinding defense and not authentication; the
# auth_request gate below is what closes this deployment.
#
# No sub_filter is needed and none should be added. The prefix reaches the
# browser as data injected by this package inside the process, from one
# validated configuration value; a filter rewriting response bytes could not
# reach the URLs that matter anyway, because runtime code builds them from
# strings that never appear whole in the response.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The credential the gate presents upstream, from whichever of the two carriers
# holds it. A page of the surrounding product calls with its own
# `Authorization: Bearer <jwt>` header and that value is forwarded verbatim.
# Everything the console itself issues — every asset, each iframe, and both
# WebSocket upgrades — can set no header at all, and identifies itself only by
# the cookie auth-gate mirrors the token into. That mirror holds a BARE jwt
# (auth-gate strips the login page's `Bearer ` scheme before writing it), so the
# scheme is added back here.
#
# `accessToken` must be spelled the same as the `cookieName` of the auth-gate
# row in the same overlay layer; nginx reads the cookie by that name and gets
# an empty string from any other spelling, which presents `Bearer ` upstream
# and closes the console to everyone.
map $http_authorization $console_token {
    ''      "Bearer $cookie_accessToken";
    default $http_authorization;
}

# Cache for the gate's userinfo answers, at http level. Keyed by the token
# itself (see the auth location), which nginx writes into the cache file's own
# header — the raw jwt therefore lands on disk, and nothing about a proxy cache
# avoids that. Keep the directory on the same restricted volume as the rest of
# nginx's private state, readable only by the worker user.
#
# The deployment creates `/data/third_party/nginx/cache` and gives it to the
# worker user before nginx starts: nginx creates the last path component and no
# more, so a missing parent is not a degraded cache but a process that refuses
# to start — `nginx -t` reports `mkdir() ".../console_auth" failed (2: No such
# file or directory)` and exits non-zero.
#
# 30s of positive caching bounds how long a revoked or expired token keeps
# working: up to 30 seconds after the authentication service starts refusing
# it. Shorten it for a deployment that needs revocation to bite sooner, at one
# upstream request per console request in the limit.
proxy_cache_path /data/third_party/nginx/cache/console_auth levels=1 keys_zone=console_auth:1m max_size=10m inactive=2m;

server {
    listen 443 ssl;
    server_name console.example.com;

    # There is deliberately no `location = /console`. Without
    # ngx_http_rewrite_module nothing here can redirect the slashless form to
    # the slash-terminated one, and proxying it directly would serve a document
    # at an address outside `Path=/console/` — the path the page writes its
    # mirror cookie with, and therefore an address the browser sends no cookie
    # back from. Every link published outward carries the trailing slash.
    location /console/ {
        # dsh authenticates nobody, so this gate is the whole of the
        # deployment's authentication. It is declared once, here, and cancelled
        # address by address in the nested locations below — deny by default,
        # so a route nobody thought about is gated rather than published:
        # /console/api with both event sockets, every route a composed plugin
        # registers, and the content app alike.
        #
        # It applies to the WebSocket upgrades too: nginx runs the auth
        # subrequest before it proxies, so an upgrade with no valid cookie is
        # refused with a status instead of being switched. This is why the
        # mirror cookie exists — a browser cannot put a header on a WebSocket
        # handshake.
        auth_request /_console_auth;

        # Both trailing slashes are load-bearing: they are what turns
        # /console/api/x into /api/x. Dropping either one forwards the prefix
        # to a process that has no route for it, and the shell answers 404 for
        # every request — or 403, when the un-stripped path leaves the static
        # dist root and the traversal check refuses it first.
        proxy_pass http://127.0.0.1:3080/;

        proxy_http_version 1.1;
        # Forwarded unchanged: the /api trust fence reads this header, and the
        # Origin comparison behind it compares against the same authority. The
        # matching `trustedHosts` entry on the dsh side is what keeps that
        # fence from answering 403 (see the header of this file).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The two event-stream sockets (/api/events.mux and /api/events.host)
        # are matched by exact pathname after stripping; without these headers
        # the upgrade is refused by closing the socket, with no status to read.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming responses must not be held back: the shell's fallback event
        # channel and every model answer arrive incrementally.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # The bootstrap, open to anyone, and it has to be. The credential this
        # gate reads from a navigation is the cookie auth-gate mirrors the
        # token into, and the only thing that writes that cookie is the
        # console's own page, from `localStorage`, after its JavaScript runs.
        # A gate over the document as well would make itself and its own only
        # credential each other's precondition: a visitor with an empty cookie
        # jar — a first visit, another browser, cleared site data, or the
        # sign-out that clears this very cookie — would be refused at the one
        # page that could have written it, with no path back. So the shell
        # document, the files it references, the client plugin bundles, and the
        # gate's own settings document are served to anyone. What that opens is
        # build output plus two facts about this deployment: the shell document
        # carries the composed plugin list and the process's stored theme
        # preference, and the settings document carries the three configured
        # values the browser half obeys. No conversation, session, or workspace
        # content is among them.
        #
        # The in-page gate covers less than this one refuses. It reads the
        # token out of `localStorage` and decides on shape and expiry alone:
        # anything that is not a JWT with an `exp` still ahead sends the visitor
        # to the login page, after the shell has painted and had its first /api
        # calls refused — the window auth-gate's own Known Limitations already
        # record. A token that is well formed and unexpired but refused by the
        # authentication service — revoked, signed with a rotated key, an account since
        # disabled — is a usable token to that gate and a refusal to this one.
        # That visitor is served the whole bootstrap: the console paints, every
        # gated request behind it is refused, a navigation to any address not
        # in the list below lands on the fixed page, and the page's own calls
        # fail for as long as it stays open. Reloading reaches the same state;
        # the token's own expiry and the sign-out control are the two ways out.
        # Closing it means the browser half leaving for the login page on a 401
        # from any of its own calls, which auth-gate's Known Limitations record
        # as deferred work.
        #
        # The login page itself must be reachable outside this gate. The
        # deployment this is written for publishes it under another prefix
        # entirely; one that puts it under /console/ opens it here too, or the
        # redirect lands on the fixed page.
        #
        # The check that proves the bootstrap is open, to re-run whenever this
        # list changes: with an empty cookie jar and no `Authorization` header,
        # `GET /console/` answers 200 and the shell document, and
        # `GET /console/api/anything` answers 401 and the fixed page.
        #
        # `auth_request off` cancels the gate inherited from this block.
        # proxy_pass is not inherited by a nested location, so each one repeats
        # its own, with the same trailing-slash pair doing the stripping;
        # everything else above — the headers, the timeouts — is inherited.
        # The file names here are the ones the built `index.html` references, so
        # a build emitting another names it here as well.
        location = /console/                     { auth_request off; proxy_pass http://127.0.0.1:3080/; }
        location = /console/index.html           { auth_request off; proxy_pass http://127.0.0.1:3080/index.html; }
        location = /console/favicon.svg          { auth_request off; proxy_pass http://127.0.0.1:3080/favicon.svg; }
        location = /console/manifest.webmanifest { auth_request off; proxy_pass http://127.0.0.1:3080/manifest.webmanifest; }
        location /console/assets/                { auth_request off; proxy_pass http://127.0.0.1:3080/assets/; }
        location /console/plugins/               { auth_request off; proxy_pass http://127.0.0.1:3080/plugins/; }
        location = /console/auth-gate/settings   { auth_request off; proxy_pass http://127.0.0.1:3080/auth-gate/settings; }
    }

    # The gate itself. nginx holds no signing key and validates no token: it
    # asks the deployment's own authentication service who the bearer is, and
    # reads only the status — 200 admits the request, 401 and 403 refuse it.
    # Every question about key rotation, expiry, and revocation therefore stays
    # with the service that issued the token.
    #
    # PLACEHOLDER: point this at the authentication service as this nginx
    # reaches it, and write the reverse-proxy path that deployment actually
    # publishes — `/nrms-auth/api/auth/userinfo` and
    # `/nrms-server/nrms-auth/api/auth/userinfo` are the two candidates, and
    # which one is live has to be confirmed with that deployment before this
    # sample is copied.
    location = /_console_auth {
        internal;
        proxy_pass https://auth.example.internal/nrms-auth/api/auth/userinfo;

        # This subrequest is the whole of the deployment's authentication
        # decision, so the hop carrying it must not be TLS nobody checks:
        # nginx verifies no upstream certificate by default, and without
        # verification anything that can answer on that address — a poisoned
        # DNS answer, a machine that took the IP — issues the 200s this gate
        # obeys. PLACEHOLDER: `proxy_ssl_trusted_certificate` is the file
        # holding the CA that signed the authentication service's certificate,
        # `proxy_ssl_name` is the name written on that certificate, and a chain
        # with an intermediate needs `proxy_ssl_verify_depth 2` as well. That
        # file is read at load, so a path that is not there is not a hop that
        # quietly stops verifying: nginx refuses to start, `nginx -t` reporting
        # `cannot load certificate "…": BIO_new_file() failed`. An
        # authentication service reached over plain http on the same machine or
        # a private network is the other supported form: write
        # `proxy_pass http://…`, drop these four directives, and the hop is
        # then exactly as private as that network is.
        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /data/third_party/nginx/auth-ca.pem;
        proxy_ssl_name                auth.example.internal;
        # SNI for the TLS hop; nginx omits it by default, and an upstream
        # serving several names on one address then presents the wrong
        # certificate and the handshake fails. It sends `proxy_ssl_name`, which
        # is also the name the verification above holds the certificate to.
        proxy_ssl_server_name on;

        # An auth subrequest is a GET with no body of its own; forwarding the
        # console request's body would send it twice and, on a large upload,
        # hold the whole request while the gate reads it. The explicit empty
        # Content-Length is what keeps the upstream from waiting for a body the
        # subrequest will not send.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization  $console_token;
        # The address being gated, for the authentication service's own log. It
        # is the only thing here that says which request was asked about.
        proxy_set_header X-Original-URI $request_uri;

        proxy_cache       console_auth;
        # The token alone. Deliberately not the URI: one visitor's answer is
        # the same for every path under the prefix, and keying by path would
        # multiply one page load's assets into that many upstream calls.
        proxy_cache_key   "$console_token";
        proxy_cache_valid 200     30s;
        proxy_cache_valid 401 403 5s;
        # One upstream call per token while an answer is being fetched; the
        # rest of a page load's requests wait for it rather than stampeding.
        proxy_cache_lock  on;
        # Everything an authentication service answers that would otherwise
        # leave this cache empty. `Cache-Control: no-store` is the obvious one.
        # `Set-Cookie` is the one that bites silently: a session endpoint
        # renewing its own cookie makes nginx refuse to store the entry, and
        # the gate degrades to one upstream call per console request, taking
        # the 30-second revocation window and proxy_cache_lock with it. Losing
        # that header costs nothing here — auth_request reads a status and
        # discards the subrequest's response, so no cookie of it was ever going
        # to reach the visitor. `Vary` is refused for the same reason: `Vary: *`
        # makes an entry unstorable.
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    }

    # What a refused visitor is served, for both statuses the gate produces —
    # 401 from a token the authentication service does not accept, 403 from one
    # it accepts and will not admit here, which is why both are cached above.
    # The client still reads 401 and 403: an error_page written without `=`
    # keeps the code it was matched on and takes only the body from the file,
    # which is what a fetch and a WebSocket handshake need to tell a refusal
    # from an answer. The form that would lose it is a bare `=`
    # (`error_page 401 = /page.html`), which hands over the file's own 200. The
    # process's own 403s — the /api trust fence, the static traversal check —
    # are untouched, because proxy_intercept_errors stays off and error_page
    # acts only on what nginx itself produced.
    error_page 401 /console-unauthorized.html;
    error_page 403 /console-unauthorized.html;

    # A fixed page, not a redirect. Nothing here can redirect without
    # ngx_http_rewrite_module, and a redirect would be wrong for the /api and
    # WebSocket requests that make up most of what this gate refuses — they
    # need a status, not a login document. The deployment supplies the file:
    # one static HTML page saying the sign-in is no longer accepted and to
    # sign in again, with a link to the login page. `internal` keeps it addressable
    # only through the error_page above.
    location = /console-unauthorized.html {
        root     /data/third_party/nginx/html;
        internal;
    }

    # auth_request admits nothing but a 200 and passes only 401 and 403
    # through; every other answer, and an authentication service that cannot be
    # reached at all, becomes a 500. Without this line that visitor reads
    # nginx's own default 500 page, which says nothing and offers nothing. 502
    # and 504 are mapped here too, because they are what the console process
    # being down looks like. A second page rather than the one above, because
    # the two carry different instructions: this one says the service is
    # temporarily unavailable and to try again, where "sign in again" would
    # send a visitor whose token is fine through a login that hands the same
    # token back. These four statuses reach the client unchanged for the same
    # reason the two above do, and share one line because a single `=<code>`
    # would flatten all four into whichever one it named.
    error_page 500 502 503 504 /console-unavailable.html;

    location = /console-unavailable.html {
        root     /data/third_party/nginx/html;
        internal;
    }

    # Out of scope here: one process per user on one machine. That routes by
    # the user id claim inside the token, which needs something that can read a
    # claim (njs or an upstream that answers with the id), and a per-user
    # upstream selection this single proxy_pass does not have.
}
