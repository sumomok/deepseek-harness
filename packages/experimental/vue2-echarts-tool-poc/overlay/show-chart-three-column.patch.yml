# `show_chart` under the service-line shell: the chart in the conversation AND
# the session's charts in the content column, from the same component row.
#
# - `ui-layout` is disabled and `server-layout` inserted in its place: 'root' is
#   a single slot and its child slots may be declared only once, so the shipped
#   shell and the service-line shell cannot coexist.
# - `content-surface` folds the session's logged events into the entry stream
#   and `content-column` claims the column the shell opens, routing it by entry
#   kind. Neither hosts an application, so `content-frame` is absent here and
#   the `page` kind simply never occurs.
# - `vue2-echarts-poc` carries the components, the Vue 2.7 runtime, and the
#   ECharts build; the row below requires it through the loader's module table.
# - `vue2-echarts-tool-poc` offers `show_chart`, claims its key in the
#   transcript's tool-view slot, and claims the `chart` kind in the column.
#
# The pair is the point: one Vue runtime, two placements of the same component,
# and the column's router knows about neither.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: vue2-echarts-poc
      name: '@deepseek-ai/dsh-experimental-vue2-echarts-poc'
    - id: show-chart
      name: '@deepseek-ai/dsh-experimental-vue2-echarts-tool-poc'
