# The Vue 2.7 chart panel in the service-line shell's content column. Three
# rows, one file:
#
# - `ui-layout` is disabled and `server-layout` inserted in its place: 'root' is
#   a single slot and its child slots may be declared only once, so the shipped
#   shell and the service-line shell cannot coexist. Only the service-line shell
#   declares `content`.
# - `vue2-echarts-poc` carries the components, the Vue 2.7 runtime, and the
#   dictionaries. It must be present: it is the module the placement row's
#   bundle requires through the loader's module table, and the row that
#   registers the copy the panel reads.
# - `vue2-echarts-content-poc` is the placement. `content-frame` is absent on
#   purpose — `content` takes one occupant, so the two placements are
#   alternatives.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: vue2-echarts-poc
      name: '@deepseek-ai/dsh-experimental-vue2-echarts-poc'
    - id: vue2-echarts-content-poc
      name: '@deepseek-ai/dsh-experimental-vue2-echarts-content-poc'
