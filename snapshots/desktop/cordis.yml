# Desktop snapshot patch, applied over the shipped `acp` profile after
# `apps/desktop-app/cordis.patch.yml`, which `desktop.snapshot.ts` names as
# this lane's base patch. The base layer is the desktop application's own
# deployment layer, byte for byte, so a row the desktop adds or changes there
# reaches this lane's model requests without being copied here. This file
# states only what a keyless, reproducible transcript needs on top of it.
#
# The `dsh` launcher owns environment loading, plugin resolution, and process
# shutdown; stdout remains reserved for ACP JSON-RPC.

# The DeepSeek adapter. The desktop row sets `retryPolicy` and nothing else,
# so the adapter's catalog would be its own default list, which lacks
# `deepseek-v4-flash`, the model the shipped `acp` row selects. A patch
# replaces the whole `config`, so the desktop's retry policy is restated with
# the catalog.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    retryPolicy:
      mode: normal
      backoff:
        maxDelayMs: 300000
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

# Persistence root: $DSH_SNAPSHOT_SESSIONS_ROOT when the snapshot harness sets
# it, else the harness home. Snapshot modes need raw JSONL for the harvest.
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are the desktop assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Answer with what you did, briefly.

# ── every tool family the base bundle offers is off ─────────────────────────
#
# This lane pins what the desktop patch adds to a model request, so an
# upstream edit to the bash, filesystem, background-job, skill, goal, todo,
# web, workflow, subagent, or plan descriptions must not churn its pin. The
# base bundle mounts each family as its own row; disabling the row withdraws
# the offer and leaves the services under it mounted. What the model is
# offered here is exactly the five `session_*` tools.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: true

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: true

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  disabled: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'
  disabled: true

- id: tool-ralph
  name: '@deepseek-ai/dsh-tool-ralph'
  disabled: true

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: true

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
  disabled: true

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
  disabled: true

- id: plan-mode
  name: '@deepseek-ai/dsh-plan-mode'
  disabled: true

# AGENTS.md discovery is off so the pinned prompt describes the composition
# rather than the run's cwd.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: true

# The desktop's brand row is off. Its Host half adds a system-prompt line that
# quotes the harness home, which is a fresh temporary directory on every run,
# and its module is the built `lib/index.js` of a package the source tree does
# not install. The row is targeted by id alone so the launcher does not try to
# link that package; a disabled row is never imported.
- id: desktop-brand
  disabled: true

# The desktop's server-log exporter mounts only when the desktop shell names
# a log file in `DSH_DESKTOP_SERVER_LOG`. It is off here so that a value
# inherited from the developer's environment cannot mount it.
- id: desktop-server-log
  disabled: true
