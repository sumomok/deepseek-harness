# Replay-only patch layered after `cordis.yml`: the whole console spine stays
# real — the tools re-execute, the routes are claimed, the deadline is really
# waited out — and only the DeepSeek adapter is replaced by `llm-replay`, which
# serves the committed model script without a key or network. No config
# restatement is needed because `cordis.yml` already names the recorded model
# and already selects raw JSONL under `DSH_SNAPSHOT`.
#
# With `DSH_SNAPSHOT=replay` the launcher reads `DSH_SNAPSHOT_FILE` and optional
# `DSH_SNAPSHOT_OVERRIDE` from the harness, and applies this patch after the
# live one. Stdout remains reserved for ACP JSON-RPC.

# `name` asserts the target: a mismatch skips the patch and warns only when a
# logger exists, and this composition mounts none.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
