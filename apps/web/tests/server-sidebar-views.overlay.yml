# Identical to `server-sidebar.overlay.yml`, plus the component rows and one
# view the deployment writes: `component-kit` (the renderers), the Vue 2.7
# runtime `component-kit` asks the loader's module table for, and
# `component-surface` carrying a `views` list. This is the one composition in
# this suite where the navigation menu has both catalogs to merge — a page from
# `content-frame` and a view from `component-surface` — which is the only place
# the merge, the per-kind command dispatch, and a `{kind: 'view'}` stop in a
# saved workflow's snapshot can be driven at all.
#
# Kept as a full standalone file rather than composed with the base overlay:
# `extraOverlayPath` takes exactly one path, and every other overlay in this
# suite is likewise self-contained.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: content-frame
      name: '@deepseek-ai/dsh-experimental-content-frame'
      config:
        root: !!js process.env.DSH_CONTENT_APP_ROOT
        pages:
          - id: home
            title: Home
            description: The hosted application's entry page.
            url: /content-app/
          - id: reports
            title: Weekly reports
            description: Published reports, newest first.
            url: /content-app/reports/

- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

- insert:
    - id: server-sidebar
      name: '@deepseek-ai/dsh-experimental-server-sidebar'
      config:
        # Claim of this deployment's access token that carries the signed-in
        # person's display name, shown in the sidebar's footer; toy-core's
        # sign-on writes it as `login_uname`.
        displayNameClaim: login_uname

# The read-only Agent-preset dropdown ("PTC mode" and friends): disabling the
# whole package removes its hero chip, its session-header preset label, and
# its Settings row together — the hero chip alone is also unreachable behind
# terminology-guard.ts's `heroWorkspaceRow` CSS rule, but that rule cannot
# reach the other two surfaces.
- id: ui-agent-preset
  name: '@deepseek-ai/dsh-client-ui-agent-preset'
  disabled: true

# Only relevant to an official build (`DSH_CLIENT_BUILD_PROFILE==='official'`
# gates its own apply() to a no-op otherwise, so this row is inert in this
# scenario's own process either way): fills the sidebar brand slots and the
# conversation hero brand mark with the official DeepSeek identity, which
# this composition replaces with its own copy.
- id: ui-brand-official
  name: '@deepseek-ai/dsh-client-ui-brand-official'
  disabled: true

# Decision ②'s remaining de-terminology rows: Trajectory tab, the Session log
# download button, and the model selector (whose own "unselected model"
# composer block never arms once it is gone — `ConversationRoot.tsx`'s
# `useComposerBlock` simply stays `undefined` with no registrant).
- id: ui-cordis
  name: '@deepseek-ai/dsh-client-ui-cordis'
  disabled: true
- id: ui-trajectory
  name: '@deepseek-ai/dsh-client-ui-trajectory'
  disabled: true
- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true
- id: session-log-download
  name: '@deepseek-ai/dsh-session-log-export'
  disabled: true
- id: ui-settings-models
  name: '@deepseek-ai/dsh-client-ui-settings-models'
  disabled: true

# The Settings → General "Permission" row: the default preset for new sessions,
# and the last user-facing permission control once the composer chip is hidden
# (`terminology-guard.ts`) and `/permission` is isolated away above. The same
# package's only other registration is the `/permission` popup decoration,
# which has no host command left to decorate. With this row gone the preset is
# a deployment constant: `defaultPreset` sets it, `pinInitialPermission` stamps
# it onto every new session, and no browser path writes it again.
- id: ui-permission
  name: '@deepseek-ai/dsh-client-ui-permission-presets'
  disabled: true

# Decision ②: the shipped preset table names its rows in vendor vocabulary —
# "workspace-write" renders as "Workspace Write" on the composer's access chip
# (`dsh-client-ui-conversation`'s `PermissionSelect`). That is not CSS chrome
# this package could rename, and it is not reachable from a dictionary: the
# label belongs to `dsh-client-ui-conversation`'s own locale namespace, which
# no other plugin may register into.
#
# The preset table itself is the seam. The chip resolves its label from the
# host-supplied `name`: one that still matches the built-in default renders the
# vendor's product label, anything else passes through verbatim
# (`PermissionSelect.tsx`'s `permissionLabel`). Renaming the rows here
# therefore replaces the vocabulary with no patch to an upstream package.
#
# All three shipped presets are restated, knob values (`sandbox`, `approval`)
# unchanged: this row replaces the whole table, so omitting one drops that
# preset rather than inheriting it. With no switch offered, the only surface
# these names still reach is the hidden chip's `aria-label`;
# `packages/experimental/server-sidebar/tests/customer-overlay.client.spec.ts`
# asserts the table, and `apps/web/tests/server-sidebar.e2e.ts` reads the
# effective preset's name off that label.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  # No permission switch reaches an end user (product decision, 2026-09-07).
  # `commands` resolves inside this entry to a realm nothing implements, so the
  # row's `ctx.inject(['commands'], …)` child never activates: `/permission` is
  # never registered, `commands.list` never names it, and the slash menu has no
  # row to filter. Isolation is per entry, so the registry the base bundle
  # composes is untouched — the switcher strip's tab and close buttons, the
  # sidebar's navigation rows, `show_component`'s press return path, and
  # `SessionFace.command()` all keep the `commands` they inject.
  isolate:
    commands: true
  config:
    # What this table derives today from the composed sandbox and approval
    # defaults (workspace-write + ask, `packages/bundle/base/cordis.patch.yml`).
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: 只读
        description: 只查看和分析文件，不做任何改动。
        glyph: read-only
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 可修改文件
        description: 可以在当前项目目录里新建和修改文件；超出范围的操作会先征求同意。
        glyph: workspace-write
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全放开
        description: 可以修改任何文件，且不再逐次征求同意。
        glyph: danger-full-access

# The bundled library-knowledge layer: one isolated `skill-filesystem` provider
# over `@deepseek-ai/dsh-experimental-library-skills`'s own `skills/` directory.
#
# `providerName` must differ from every other provider in the layer — a repeated
# name throws at insert. `includeDefaultRoots: false` keeps the row off the
# project, user, and environment roots, so it contributes this one directory and
# nothing else. `bundledSkillDir` mounts it at `BUNDLED_SKILL_RANK` (600), below
# every user-writable root, which is what lets a user's same-named skill replace
# a shipped one.
#
# The path resolves the package by name from the profile this layer is installed
# into, so the skills travel with the package version rather than with a
# deployment path. This row therefore makes that package a deployment dependency
# of every composition carrying it: a profile that cannot resolve it throws
# MODULE_NOT_FOUND while the row loads, and the boot fails. The quiet failure is
# the other one — a resolvable package whose `skills/` is missing or empty mounts
# a root that lists nothing.
- insert:
    - id: library-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: library-skills
        includeDefaultRoots: false
        bundledSkillDir: !!js "process.getBuiltinModule('node:path').resolve(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-library-skills/package.json'), '../skills')"

- insert:
    - id: vue2-echarts-poc
      name: '@deepseek-ai/dsh-experimental-vue2-echarts-poc'
    - id: component-kit
      name: '@deepseek-ai/dsh-experimental-component-kit'
    - id: show-component
      name: '@deepseek-ai/dsh-experimental-component-surface'
      config:
        views:
          # The arrangement a service line actually writes: the list of sites
          # above the details of whichever row the user picks, bound with
          # `$from` so the second block follows the first. Judged at load by
          # the same pass that judges a `show_component` call, so a broken
          # spec would stop this scenario's own boot.
          - id: site-overview
            title: Site overview
            spec:
              nodes:
                - id: sites
                  component: toy.table
                  props:
                    selectMode: radio
                    tableConfig:
                      gridItems:
                        - { relatedMetaAttr: name, alias: Site }
                        - { relatedMetaAttr: status, alias: Status }
                    displayValueList:
                      - { name: North plant, status: Running }
                      - { name: South plant, status: Stopped }
                - id: detail
                  component: toy.record
                  props:
                    dataList: { $from: 'node:sites.selectionDetail' }
                    columnNum: 1
              layout:
                node: stack
                dir: col
                gap: md
                children:
                  - { node: component, id: sites, flex: 2 }
                  - { node: component, id: detail, flex: 1 }
