# Identical to `server-sidebar.overlay.yml`, plus `content-frame`'s `homePage`
# config — the one field difference the workbench's auto-open-on-click
# scenario needs. Kept as a full standalone file rather than composed with the
# base overlay: `extraOverlayPath` takes exactly one path, and every other
# overlay in this suite is likewise self-contained.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: content-frame
      name: '@deepseek-ai/dsh-experimental-content-frame'
      config:
        root: !!js process.env.DSH_CONTENT_APP_ROOT
        pages:
          - id: home
            title: Home
            description: The hosted application's entry page.
            url: /content-app/
          - id: reports
            title: Weekly reports
            description: Published reports, newest first.
            url: /content-app/reports/
        homePage: home

- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

- insert:
    - id: server-sidebar
      name: '@deepseek-ai/dsh-experimental-server-sidebar'

- id: ui-cordis
  name: '@deepseek-ai/dsh-client-ui-cordis'
  disabled: true
- id: ui-trajectory
  name: '@deepseek-ai/dsh-client-ui-trajectory'
  disabled: true
- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true
- id: session-log-download
  name: '@deepseek-ai/dsh-session-log-export'
  disabled: true

# Decision ②: the shipped preset table names its rows in vendor vocabulary —
# "workspace-write" renders as "Workspace Write" on the composer's access chip
# (`dsh-client-ui-conversation`'s `PermissionSelect`), in the `/permission`
# popup, and in the Settings default row. None of that is CSS chrome this
# package could hide, and none of it is reachable from a dictionary: those
# labels belong to `dsh-client-ui-conversation`'s own locale namespace, which
# no other plugin may register into.
#
# The preset table itself is the seam. Both client surfaces resolve a label
# the same way — a host-supplied `name` that still matches the built-in
# default renders the vendor's product label, anything else passes through
# verbatim (`PermissionSelect.tsx`'s `permissionLabel`,
# `presentation.ts`'s `displayPermissionPreset`). Renaming the rows here
# therefore replaces the vocabulary on every surface at once, with no patch to
# an upstream package.
#
# All three shipped presets are restated, knob values (`sandbox`, `approval`)
# unchanged: this row replaces the whole table, so omitting one drops that
# preset rather than inheriting it — a customer would simply lose that choice.
# `apps/web/tests/server-sidebar.e2e.ts` asserts the resulting set.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: 只读
        description: 只查看和分析文件，不做任何改动。
        glyph: read-only
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 可修改文件
        description: 可以在当前项目目录里新建和修改文件；超出范围的操作会先征求同意。
        glyph: workspace-write
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全放开
        description: 可以修改任何文件，且不再逐次征求同意。
        glyph: danger-full-access
