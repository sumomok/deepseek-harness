# The deployment layer the product-console sidebar scenarios install beside
# `@deepseek-ai/dsh-experimental-console-profile`: the content column's page
# catalog, with two pages so the navigation group has more than one page route
# to list. Everything else a console composes — the shell, the sidebar, and
# decision ②'s de-terminology rows — is the console bundle's own layer, which
# is what lets the settings service save the sidebar's menu into the profile
# patch; `packages/experimental/console-profile/tests/profile.spec.ts` checks
# that this file restates none of it.
- insert:
    - id: content-frame
      name: '@deepseek-ai/dsh-experimental-content-frame'
      config:
        root: !!js process.env.DSH_CONTENT_APP_ROOT
        pages:
          - id: home
            title: Home
            description: The hosted application's entry page.
            url: /content-app/
          - id: reports
            title: Weekly reports
            description: Published reports, newest first.
            url: /content-app/reports/
