# Identical to `packages/experimental/content-frame/overlay/content-column.patch.yml`,
# plus the two things a picture read needs and the four text-read scenarios do
# not: a route that declares image input, and the hosted application's own
# `?pictures=code`, which leaves the page one picture — the checked-in PNG — so
# this scenario's recording pins no browser-rasterized bytes. The attachment
# store the read keeps its pixels in is already in the shipped base bundle
# (`attachment-local`). Kept as a full standalone file rather than composed with
# the package's own overlay: `extraOverlayPath` takes exactly one path, and
# every other overlay in this suite is likewise self-contained.
#
# What is NOT here is the scenario's other half. Every model tool this profile
# offers comes from a preset — `packages/bundle/web-app/cordis.patch.yml`
# disables all of its `tool-*` rows and `presets/standard/agent.cordis.yml`
# mounts them again — so a patch layer cannot take `bash` or `read_image` away
# from a session. The spec composes its session from `tests/fixtures/presets/`
# instead, which mounts none of them.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: content-frame
      name: '@deepseek-ai/dsh-experimental-content-frame'
      config:
        root: !!js process.env.DSH_CONTENT_APP_ROOT
        pages:
          - id: home
            title: Home
            description: The hosted application's entry page.
            url: /content-app/?pictures=code
        defaultPage: home
        pageAccess: {}

# What this composition's sessions start on. It is not what routes the session
# this scenario drives: that one replays a seed whose log already carries a
# request header, and a session that logged one derives its route from its own
# log — the spec selects the route on it the way the composer's picker does.
# The row is here so a session created in this composition starts where the
# picture read can run. The replay catalog in `scaffold.ts` publishes the route.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp
