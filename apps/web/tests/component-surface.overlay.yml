# The console composition plus the component rows: the service-line shell, the
# entry stream, the column that routes it by kind, the component row that
# carries the renderers, and the row that offers `show_component` and claims the
# column's `component` kind.
#
# Same five rows as the package's own overlay, restated here because that one
# layers over the console patch while this scenario boots the shipped Web
# surface directly. `content-frame` is deliberately absent: this scenario draws
# no page, so the column's other kind never occurs.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true

- insert:
    - id: server-layout
      name: '@deepseek-ai/dsh-experimental-server-layout'
    - id: content-surface
      name: '@deepseek-ai/dsh-experimental-content-surface'
    - id: content-column
      name: '@deepseek-ai/dsh-experimental-content-column'
    - id: component-kit
      name: '@deepseek-ai/dsh-experimental-component-kit'
    - id: show-component
      name: '@deepseek-ai/dsh-experimental-component-surface'
