# electron-builder configuration for the DSH desktop client. The heavy content
# ships as resources, not app code: `server/` is the pnpm-deployed `dsh web`
# closure (see apps/desktop-server), copied by scripts/after-pack.cjs because
# the builder's extraResources copier hard-excludes node_modules trees, and
# `runtime/` is the bundled Node binary scripts/package.ts stages per
# platform. Native modules are the server's own N-API prebuilds (node-pty,
# koffi), so electron-builder must not rebuild anything against Electron's ABI.
appId: dev.dsh.desktop
productName: DSH Desktop
directories:
  output: dist-app
  buildResources: build
files:
  - lib/**/*
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
afterPack: scripts/after-pack.cjs
# Only the languages the product ships; the full Electron locale set is ~50
# extra files the installer would extract for nothing.
electronLanguages:
  - en-US
  - zh-CN
mac:
  target:
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  # Unsigned development build; Gatekeeper needs a right-click open (or
  # `xattr -dr com.apple.quarantine`) on other machines.
  identity: null
  category: public.app-category.developer-tools
  icon: build/icon.icns
  extraResources:
    - from: staging/runtime/darwin
      to: runtime
  # Generates latest-mac.yml beside the zip. src/updater.ts reads that file
  # itself: Squirrel.Mac only stages an update for a signed app, so macOS
  # detects the new version and opens the download instead of installing it.
  publish:
    - provider: generic
      url: https://lhr.ink/dsh-updates/mac
      channel: latest
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No certificate is configured, so the builder's signing pass can only
  # damage the output: on a macOS host it rewrites the finished installer
  # AFTER makensis computed its integrity CRC without registering a PE
  # certificate entry, and the installer then fails NSIS's startup check on
  # real Windows. signExecutable: false skips exactly the signing while
  # keeping the icon and version-metadata editing of the app executable.
  signExecutable: false
  extraResources:
    - from: staging/runtime/win
      to: runtime
  # Generates latest.yml beside the installer and app-update.yml inside the
  # app, which is the feed electron-updater's NsisUpdater downloads from.
  # `channel: latest` is explicit because the default derives the channel from
  # the version's prerelease tag: an 0.1.0-rc.N build would otherwise publish
  # and look for rc.yml, and the channel would rename itself at every stage of
  # the release cycle. This product has one channel.
  publish:
    - provider: generic
      url: https://lhr.ink/dsh-updates/win
      channel: latest
# No per-file details pane: the builder's NSIS template extracts one app-64.7z
# through a plugin, so the NSIS details list has no File entries to show —
# progress is the byte-based bar only. Install speed comes from payload size.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
