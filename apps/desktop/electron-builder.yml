# electron-builder configuration for the DSH desktop client. The heavy content
# ships as resources, not app code: `server/` is the pnpm-deployed `dsh web`
# closure (see apps/desktop-server), copied by scripts/after-pack.cjs because
# the builder's extraResources copier hard-excludes node_modules trees, and
# `runtime/` is the bundled Node binary scripts/package.ts stages per
# platform. Native modules are the server's own N-API prebuilds (node-pty,
# koffi), so electron-builder must not rebuild anything against Electron's ABI.
appId: dev.dsh.desktop
productName: DSH Desktop
directories:
  output: dist-app
  buildResources: build
files:
  - lib/**/*
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
afterPack: scripts/after-pack.cjs
# Locale trimming is declared per platform in the `mac:` and `win:` sections
# below: the product ships two languages and the full Electron locale set is ~50
# extra files the installer would extract for nothing. The two lists cannot be
# one, because app-builder-lib matches each entry against the locale file's own
# basename (`removeUnusedLanguagesIfNeeded`, ElectronFramework.js) and the
# platforms name those files differently — macOS keeps
# `Contents/Resources/zh_CN.lproj` beside a bare `en.lproj`, Windows keeps
# `locales/zh-CN.pak` beside `en-US.pak`. A platform list replaces a top-level
# `electronLanguages` outright instead of merging with it, and a name matching
# no file is dropped in silence: only a list that matches nothing at all is
# warned about, and the app is left with whatever the platform ships by default.
# `src/menu-text.ts` reads `app.getLocale()`, which on macOS resolves against the
# .lproj set that survives here.
mac:
  electronLanguages:
    - en
    - zh_CN
  target:
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  # Unsigned development build; Gatekeeper needs a right-click open (or
  # `xattr -dr com.apple.quarantine`) on other machines.
  identity: null
  category: public.app-category.developer-tools
  icon: build/icon.icns
  extraResources:
    - from: staging/runtime/darwin
      to: runtime
  # Generates latest-mac.yml beside the zip. src/updater.ts reads that file
  # itself: Squirrel.Mac only stages an update for a signed app, so macOS
  # detects the new version and opens the download instead of installing it.
  publish:
    - provider: generic
      url: https://lhr.ink/dsh-updates/mac
      channel: latest
win:
  electronLanguages:
    - en-US
    - zh-CN
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # No certificate is configured, so the builder's signing pass can only
  # damage the output: on a macOS host it rewrites the finished installer
  # AFTER makensis computed its integrity CRC without registering a PE
  # certificate entry, and the installer then fails NSIS's startup check on
  # real Windows. signExecutable: false skips exactly the signing while
  # keeping the icon and version-metadata editing of the app executable.
  signExecutable: false
  extraResources:
    - from: staging/runtime/win
      to: runtime
    # The tray icon. The executable's own icon is compiled into the PE and is
    # not readable back as an image, so the notification area is served the
    # same source file the builder used, resized in process.
    - from: build/icon.ico
      to: icon.ico
  # Generates latest.yml beside the installer and app-update.yml inside the
  # app, which is the feed electron-updater's NsisUpdater downloads from.
  # `channel: latest` is explicit because the default derives the channel from
  # the version's prerelease tag: an 0.1.0-rc.N build would otherwise publish
  # and look for rc.yml, and the channel would rename itself at every stage of
  # the release cycle. This product has one channel.
  publish:
    - provider: generic
      url: https://lhr.ink/dsh-updates/win
      channel: latest
# No per-file details pane: the builder's NSIS template extracts one app-64.7z
# through a plugin, so the NSIS details list has no File entries to show —
# progress is the byte-based bar only. Install speed comes from payload size.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # One install mode, for all users. The mode page is gone with it, and so is
  # the failure it produced: an install that resolved to per-machine while the
  # updater had spawned the installer without elevation, whose silent uninstall
  # of the old per-machine version then aborted with exit code 2.
  perMachine: true
  # Required for the updater to elevate, and not implied by perMachine. The
  # helper is copied either way — `NsisUtil.copy` only skips it on an explicit
  # `false` — but the manifest flag the updater reads comes from
  # `updateInfo != null && isPerMachine && (oneClick || options.packElevateHelper)`
  # (NsisTarget.js), where an unset option is falsy. Without this line the
  # build ships elevate.exe and never tells the updater to use it.
  packElevateHelper: true
