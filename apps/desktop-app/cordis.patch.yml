# The desktop application's deployment layer. `apps/desktop-shell`'s profile seed
# names this package after dsh-base, dsh-web-app, and every built-in plugin
# layer in the desktop profile's `dsh.profile.bundles`, and before the user
# layers — `$DSH_HOME/profiles/desktop-shell/cordis.patch.yml`, then
# `$DSH_HOME/cordis.patch.yml`, then any `--patch` overlay — so a row here is a
# deployment default the user's own patch layer can still replace.
#
# A patch replaces the targeted row's whole `config`, so each row restates
# every key it owns.

# Full-text session search over conversation content, which dsh-base and
# dsh-web-app both ship off (`openAt: never`, so `searchSessions` fails with
# SESSION_QUERY_SEARCH_DISABLED and the sidebar matches titles and Workspace
# names only). `first-search` defers the node:sqlite import and the index open
# until a search actually asks for one, so an app start that never searches
# costs nothing. The index is a derived database this deployment owns, separate
# from the session-persistence store under `dshHomePath('sessions')`; keeping it
# durable rather than `:memory:` means only new and changed logs are read after
# the first index build, instead of the whole corpus on every launch.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search/desktop.db')
    openAt: first-search

# How long a rate-limited request may wait before the turn gives up. When a
# provider answers 429 with `Retry-After`, dsh-llm-retry accepts that wait only
# while it fits inside `maxDelayMs`, and a `normal` policy that finds it too
# long delegates to the next handler instead — which ends the turn with the
# original error. The shipped ceiling is 10 seconds while DeepSeek's rate-limit
# windows commonly run 30 to 120 seconds, so a wait the provider explicitly
# asked for arrives as a failed turn. Five minutes covers those windows, and
# the browser half already counts the remaining seconds down in the transcript,
# so the wait is visible rather than a stalled screen. The ceiling bounds one
# wait, not a step: a provider delay inside it is waited out verbatim, and the
# five-retry cap is counted per step (`step/start` and `turn/end` reset it), so
# a step's worst case is five ceilings — 25 minutes at this value, 2.5 to 10
# minutes across those windows — and every wait aborts the moment the user
# stops the turn. Local backoff does not move with it: it is `min(500 * 2 **
# (retry - 1), maxDelayMs)` under a tenth of jitter over at most five retries,
# so the ceiling never binds it and its longest wait stays 8.8 seconds either
# way. Only the `Retry-After` value this deployment is willing to honor
# changes. The retry executor itself (`llm-retry`) takes no config at all — it
# rejects every key, `retryPolicy` with a message naming this row — because the
# policy belongs to the provider whose route it retries.
#
# `models` is restated because @haoran/dsh-default-model sets it on this same
# row one layer below and a patch replaces the whole `config`; dropping it here
# would take the model picker's catalog with it, including the row the default
# selection names. `apps/desktop-shell/tests/desktop-composition-layer.spec.ts`
# compares this table against the composed one below, so a catalog that moves
# there fails here rather than in the picker.
#
# One row, because DeepSeek retired the others: its pricing page says the
# legacy `deepseek-v4-flash` and `deepseek-v4-flash-vision-exp` names are still
# accepted but served by DeepSeek-V4.1-Flash, and that `deepseek-v4-pro`
# requests route to it from 2026-09-14 12:00 Beijing as well.
#
# This row is mounted by `@deepseek-ai/dsh-llm-deepseek-api-key`; its catalog
# is still `@deepseek-ai/dsh-llm-deepseek`'s `DEFAULT_MODELS`, whose
# `deepseek-flash` row this table restates rather than stating one. `models` is
# a whole-table replacement — `resolveModels` reads `config.models ??
# DEFAULT_MODELS` and never merges the two — so every field the adapter's row
# declares has to be repeated here or it is dropped. Every field below is the
# adapter's own value except two this deployment owns, `name` and
# `description`, because the picker reads a version with the dot and a Chinese
# line under it. The row sets no image budget, as the adapter's own row sets
# none: a request image is sent at its own size when its token grid fits the
# provider's limit, scaled onto that grid otherwise, and encoded toward the
# adapter's 2 MiB target.
# `systemPromptUpdate: in-history` is a field that costs something when it
# goes missing — without it `agent.ts` sets `inHistory: false`, and a
# mid-session system-prompt change rewrites system node 0 instead of appending
# a node after the cached history, which misses the provider prefix cache from
# the first token. `toolUpdate: addition-only` is the other: without it every
# request declares the complete current tool list, so a tool that joins
# mid-session, such as an MCP server's, changes the declarations ahead of the
# cached history instead of arriving as an addition after it. The composition
# test compares this row against the shipped adapter's field for field, so a
# field upstream adds fails there rather than reaching the picker as a
# silently dropped capability.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      backoff:
        maxDelayMs: 300000
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        description: V4.1 Flash · 文本与图片
        contextWindow: 1000000
        inputModalities: [text, image]
        systemPromptUpdate: in-history
        toolUpdate: addition-only

# Where an image sent on a model without vision moves the session to.
# Absent a `target`, @haoran/dsh-vision-switch falls back to a DEFAULT_TARGET
# compiled into it (`deepseek-official` / `deepseek-flash`), which is also the
# model `agent-default-model` starts every session on. An auto-switch that
# moves a session off its own default onto a different vision model is a
# switch the user did not ask for, so the two have to stay one model. Naming
# the target here settles it from composition rather than from the plugin's
# compiled-in constant, and
# `apps/desktop-shell/tests/desktop-composition-layer.spec.ts` holds the two to the
# same model.
#
# `enabled` is restated because an id-targeted patch replaces the whole
# `config`, and the plugin's own layer is where it is set; those two keys are
# the plugin's entire Config.
- id: vision-switch
  config:
    enabled: true
    target:
      provider: deepseek-official
      model: deepseek-flash

# The review model's own route, which is not the agent's. The gate's own layer
# ships `deepseek-official` / `deepseek-flash`, the pair restated here, so this
# row composes unchanged today; it is here so the deployment names the model
# its judge runs on rather than inheriting whatever a later gate release ships.
# A judge choice stored from the gate's settings page still wins over this
# pair.
#
# `provider` and `model` are the gate's only required fields, and its own patch
# layer sets exactly those two; every other field carries a schema default, so
# this whole-config replacement drops nothing.
# `apps/desktop-shell/tests/desktop-composition-layer.spec.ts` holds both
# layers to exactly these two keys. `walledReview` and the three judge fields
# stay out of this row on purpose: they are volatile fields the settings page
# writes, and a value written here would become the form's base, so "use the
# installed setting" would clear a field back to this row's value instead of to
# the schema default.
#
# This row stops reaching a machine once that machine writes the gate's row
# itself. The first save from the gate's settings page or `/review`, and the
# one-time import of an older `settings.yaml` section, write the row's whole
# composed config, `provider` and `model` included, into
# `$DSH_HOME/profiles/desktop-shell/cordis.patch.yml`, which applies after
# every bundle layer. From then on a change to the two values below reaches
# only fresh installs and machines that never saved or imported a gate
# setting.
- id: llm-permission-gateway
  config:
    provider: deepseek-official
    model: deepseek-flash

# Plugin management is upstream's. dsh-base's `plugin-manager` Host row serves
# the `pluginManager` service that installs, enables, and removes bundles, and
# dsh-web-app's `ui-plugin-manager` row is the sidebar Plugins page over it;
# both stay on. What this row sets is where that service finds pnpm.
# `pnpmCommand` names one executable, spawned with no arguments of its own
# before the pnpm subcommand, and the machines this product targets have
# neither pnpm nor Node on `PATH`. A packaged launch names
# `resources/runtime/dsh-pnpm` (`dsh-pnpm.cmd` on Windows) in
# `DSH_DESKTOP_PNPM`, a script that runs the shipped pnpm under the bundled
# Node (`apps/desktop-shell/src/pnpm-launcher.ts`); a development launch names
# nothing, and the service falls back to the developer's own `pnpm`.
#
# The row carries `config` alone, so dsh-base's `disabled` expression, which
# mounts the service only under a profile, still applies. dsh-base's row
# carries no config, so this whole-config replacement drops nothing.
- id: plugin-manager
  config:
    pnpmCommand: !!js process.env.DSH_DESKTOP_PNPM ?? 'pnpm'

# No Office preview. The `office-to-pdf` Host row starts LibreOffice converters
# for the right Sidebar's document tab, and the payload carries no LibreOffice
# engine for them to run: `platformDirRules` in
# `apps/desktop-shell/scripts/platform-dir-rules.ts` drops every
# `@deepseek-ai/libreoffice-kit-*` engine from both targets. With the row off,
# nothing creates a converter, so nothing resolves an engine; the kit's entry
# package stays in the payload because `@deepseek-ai/dsh-office-to-pdf` imports
# it.
- id: office-to-pdf
  disabled: true

# Work details start compact: a process group's header names its categories
# only, where `standard`, the form's own default, adds the live task detail,
# commands and paths included. `transcriptView` is a volatile field of the
# `ui-chat` settings form, so this row sets its base. Once a user saves a Chat
# display preference, the row's config is written into
# `$DSH_HOME/profiles/desktop-shell/cordis.patch.yml`, and from then on a
# change here reaches only machines that never saved one. dsh-web-app's row
# carries no config, so this replacement drops nothing.
- id: ui-chat
  config:
    transcriptView: compact
