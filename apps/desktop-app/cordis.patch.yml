# The desktop application's deployment layer. `apps/desktop-shell`'s profile seed
# names this package after dsh-base, dsh-web-app, and every built-in plugin
# layer in the desktop profile's `dsh.profile.bundles`, and before the user
# layers — `$DSH_HOME/profiles/desktop/cordis.patch.yml`, then
# `$DSH_HOME/cordis.patch.yml`, then any `--patch` overlay — so a row here is a
# deployment default the user's own patch layer can still replace.
#
# A patch replaces the targeted row's whole `config`, so each row restates
# every key it owns.

# Full-text session search over conversation content, which dsh-base and
# dsh-web-app both ship off (`openAt: never`, so `searchSessions` fails with
# SESSION_QUERY_SEARCH_DISABLED and the sidebar matches titles and Workspace
# names only). `first-search` defers the node:sqlite import and the index open
# until a search actually asks for one, so an app start that never searches
# costs nothing. The index is a derived database this deployment owns, separate
# from the session-persistence store under `dshHomePath('sessions')`; keeping it
# durable rather than `:memory:` means only new and changed logs are read after
# the first index build, instead of the whole corpus on every launch.
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-search/desktop.db')
    openAt: first-search

# How long a rate-limited request may wait before the turn gives up. When a
# provider answers 429 with `Retry-After`, dsh-llm-retry accepts that wait only
# while it fits inside `maxDelayMs`, and a `normal` policy that finds it too
# long delegates to the next handler instead — which ends the turn with the
# original error. The shipped ceiling is 10 seconds while DeepSeek's rate-limit
# windows commonly run 30 to 120 seconds, so a wait the provider explicitly
# asked for arrives as a failed turn. Five minutes covers those windows, and
# the browser half already counts the remaining seconds down in the transcript,
# so the wait is visible rather than a stalled screen. The ceiling bounds one
# wait, not a step: a provider delay inside it is waited out verbatim, and the
# five-retry cap is counted per step (`step/start` and `turn/end` reset it), so
# a step's worst case is five ceilings — 25 minutes at this value, 2.5 to 10
# minutes across those windows — and every wait aborts the moment the user
# stops the turn. Local backoff does not move with it: it is `min(500 * 2 **
# (retry - 1), maxDelayMs)` under a tenth of jitter over at most five retries,
# so the ceiling never binds it and its longest wait stays 8.8 seconds either
# way. Only the `Retry-After` value this deployment is willing to honor
# changes. The retry executor itself (`llm-retry`) takes no config at all — it
# rejects every key, `retryPolicy` with a message naming this row — because the
# policy belongs to the provider whose route it retries.
#
# `models` is restated because @haoran/dsh-default-model sets it on this same
# row one layer below and a patch replaces the whole `config`; dropping it here
# would take the model picker's catalog with it, including the row the default
# selection names. `apps/desktop-shell/tests/desktop-composition-layer.spec.ts`
# compares this table against the composed one below, so a catalog that moves
# there fails here rather than in the picker.
#
# One row, because DeepSeek retired the others: its pricing page says the
# legacy `deepseek-v4-flash` and `deepseek-v4-flash-vision-exp` names are still
# accepted but served by DeepSeek-V4.1-Flash, and that `deepseek-v4-pro`
# requests route to it from 2026-09-14 12:00 Beijing as well.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      backoff:
        maxDelayMs: 300000
    models:
      - id: deepseek-flash
        name: DeepSeek-V4.1-Flash
        description: V4.1 Flash · 文本与图片
        inputModalities: [text, image]

# Where an attachment sent on a model without vision moves the session to.
# Absent a `target`, @haoran/dsh-vision-switch falls back to a DEFAULT_TARGET
# compiled into it (`deepseek-official` / `deepseek-v4-flash-vision-exp`),
# chosen when that was also this deployment's starting model. It is not any
# more: `agent-default-model` above starts on `deepseek-flash`, and an
# auto-switch that moves a session off its own default onto a different vision
# model is a switch the user did not ask for. Naming the target here settles it
# from composition rather than from the plugin's compiled-in constant, and
# `apps/desktop-shell/tests/desktop-composition-layer.spec.ts` holds the two to the
# same model.
#
# `enabled` is restated because an id-targeted patch replaces the whole
# `config`, and the plugin's own layer is where it is set; those two keys are
# the plugin's entire Config.
- id: vision-switch
  config:
    enabled: true
    target:
      provider: deepseek-official
      model: deepseek-flash

# The review model's own route, which is not the agent's. The gate ships
# `deepseek-v4-flash` as its factory pair, and that model is retired: DeepSeek
# still accepts the name and serves it with V4.1 Flash, so the judge would keep
# working, but the deployment should name what it actually runs on rather than
# a redirect. A stored choice from the gate's settings page still wins over
# this pair.
#
# `provider` and `model` are the gate's only required fields, and its own patch
# layer sets exactly those two; every other field carries a schema default. So
# this whole-config replacement drops nothing — confirmed against
# `dsh --profile <name> --dump-config`, where the composed row before and after
# carries these two keys and no others.
- id: llm-permission-gateway
  config:
    provider: deepseek-official
    model: deepseek-flash
