packages:
  - vendor/*
  - packages/*/*
  # The Landlock launcher is developed with its harness consumers but keeps
  # its native build and publication scripts under native/landlock-run.
  - native/landlock-run
  - native/landlock-run/packages/*
  # Product assemblies over the package tier; apps/cli owns the `dsh` bin.
  - apps/*
  - website
  # Deploy root of the single-exe build: a pure dependency manifest whose
  # closure is what the exe bundles and what the Python runtime distributes.
  - python/sdk-runtime

# Vendored framework packages keep their upstream semver ranges, while local
# builds must resolve those matching names to this workspace's pinned sources.
linkWorkspacePackages: true

overrides:
  '@deepseek-ai/cosmokit': 'link:vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:vendor/schemastery'
  # dsh-better-sidebar declares `node-pty: ^1.1.0` and documents that it must
  # resolve to the SAME physical package as the harness core, which pins
  # 1.2.0-beta.15 (patched by patches/node-pty@1.2.0-beta.15.patch). That
  # prerelease is outside the plugin's range, so without this override the
  # desktop payload carries two node-pty copies, and the nested one is out of
  # reach of both the `node-pty/prebuilds` platform prune rules and the
  # spawn-helper chmod in apps/desktop/scripts/package.ts. The versions are
  # API-compatible: `resize` gained an optional third argument and `useConpty`
  # became a no-op.
  'dsh-better-sidebar>node-pty': '1.2.0-beta.15'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) and lefthook
# (git hooks) genuinely need theirs.
allowBuilds:
  esbuild: true
  lefthook: true
  # apps/desktop: Electron's postinstall downloads its platform binary; without
  # it the desktop client cannot launch or package.
  electron: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # The Python runtime deploy includes the reviewed workspace postinstall that
  # restores the executable bit on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local@file:packages/subprocess/subprocess-local': true
  # Pulled in by electron-builder for its Squirrel.Windows target; the desktop
  # app ships NSIS only, so the Squirrel binary download is denied.
  electron-winstaller: false

minimumReleaseAgeExclude:
  # Fresh pi-ai releases carry the model catalog updates that are the whole
  # point of bumping it; waiting out the release age would defeat that.
  - '@earendil-works/pi-ai@0.84.2'
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4
  # The active pnpm supply-chain policy blocks this reviewed runtime closure
  # until its release-age window expires unless every exact package is exempt.
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.241'
  - '@anthropic-ai/claude-agent-sdk@0.3.241'
  # All platform aliases resolve to the @openai/codex package name, so their
  # reviewed exact versions must share one version-union policy entry.
  - '@openai/codex@0.149.1||0.149.1-darwin-arm64||0.149.1-darwin-x64||0.149.1-linux-arm64||0.149.1-linux-x64||0.149.1-win32-arm64||0.149.1-win32-x64'

patchedDependencies:
  # electron-builder commit 5eed26b2a9cfd06a1dbe207b25a46ce2c0b05ae9 (PR #10021),
  # verbatim: the multipart range branch of the differential download attaches
  # `response.on("error", reject)` like the single-range branch beside it, so an
  # interrupted multipart response rejects instead of raising an unhandled
  # 'error' event, which in the Electron main process is an uncaught exception.
  # Retire this entry and patches/electron-updater@6.8.9.patch at the first
  # electron-updater release that carries that commit; 6.8.9 is the latest
  # published version and predates it. pnpm raises that question by itself:
  # with neither allowUnusedPatches nor ignorePatchFailures set, a bump that
  # leaves this exact-version patch unused or unapplicable fails the install
  # (ERR_PNPM_UNUSED_PATCH / ERR_PNPM_PATCH_FAILED) instead of dropping it.
  electron-updater@6.8.9: patches/electron-updater@6.8.9.patch
  node-pty@1.2.0-beta.15: patches/node-pty@1.2.0-beta.15.patch
